name: Deploy Temporário - Diagnóstico do Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Grupo independente do workflow principal para testar uma nova execução.
concurrency:
  group: pages-temporario-diagnostico
  cancel-in-progress: true

jobs:
  deploy:
    name: Testar build e publicação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
