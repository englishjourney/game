name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Altere para 'master' se a sua branch principal tiver esse nome

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dos arquivos para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Se os arquivos HTML/CSS/JS estiverem em uma pasta específica, troque por './pasta'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
