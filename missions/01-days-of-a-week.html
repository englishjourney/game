<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#58cc02">
    <meta name="description" content="Learn the days of the week in English with Artie.">
    <title>Days of the Week | EnglishJourney</title>
    <link rel="stylesheet" href="./components/mission.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
/* Estilos específicos desta missão.
   O visual compartilhado fica em components/mission.css. */
.ej-mission-content .ej-days-grid {
    align-items: stretch;
}

.ej-mission-content .ej-day-card {
    min-height: 116px;
}

.ej-mission-content .ej-day-name {
    letter-spacing: -.02em;
}



/* Day Racer */
.ej-race{position:relative;min-height:570px;overflow:hidden;border-radius:22px;background:#82cfea;isolation:isolate;touch-action:pan-y}
.ej-race-sky{position:absolute;inset:0 0 52%;background:linear-gradient(#69c5ed,#d9f6ff);overflow:hidden}
.ej-cloud{position:absolute;width:100px;height:28px;border-radius:30px;background:#fff;opacity:.9;animation:ej-cloud-move 20s linear infinite}
.ej-cloud:before,.ej-cloud:after{content:"";position:absolute;bottom:5px;border-radius:50%;background:#fff}
.ej-cloud:before{width:42px;height:42px;left:15px}.ej-cloud:after{width:35px;height:35px;right:13px}
.ej-cloud:nth-child(1){top:20%;left:-120px;animation-duration:17s}.ej-cloud:nth-child(2){top:55%;left:-120px;animation-duration:26s;animation-delay:-9s;scale:.7}.ej-cloud:nth-child(3){top:36%;left:-120px;animation-duration:31s;animation-delay:-18s;scale:1.2}
@keyframes ej-cloud-move{to{transform:translateX(calc(100vw + 250px))}}
.ej-road{position:absolute;inset:43% -35% -12%;background:linear-gradient(90deg,#60656b,#34383e 50%,#60656b);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);overflow:hidden}
.ej-road:before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 2px);width:4px;background:repeating-linear-gradient(to bottom,#fff 0 34px,transparent 34px 78px);animation:ej-lines .55s linear infinite}
.ej-road:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#aeb5bc 1.3px,transparent 2px),radial-gradient(circle,#818991 1px,transparent 2px);background-size:34px 47px,57px 63px;animation:ej-specks .7s linear infinite}
@keyframes ej-lines{to{background-position-y:78px}}@keyframes ej-specks{to{background-position:0 47px,20px 63px}}
.ej-race-hud{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
.ej-race-hud>div{padding:8px 13px;border-radius:13px;background:#ffffffeb;color:#243044;font-weight:900;box-shadow:0 3px 10px #0002}
.ej-race-hud strong{display:block;font-size:1.25rem}
.ej-race-words{position:absolute;z-index:3;inset:43% 0 0;pointer-events:none}
.ej-race-word{position:absolute;top:-12%;width:clamp(70px,18%,110px);padding:8px 3px;border:2px solid white;border-bottom-width:5px;border-radius:12px;background:#fff5c9;color:#273548;text-align:center;font-weight:1000;font-size:clamp(.72rem,2.5vw,.95rem);transform:translateX(-50%);box-shadow:0 4px 8px #0003}
.ej-car{position:absolute;z-index:4;bottom:8%;left:50%;width:65px;height:105px;transform:translateX(-50%);border:3px solid white;border-radius:18px 18px 12px 12px;background:linear-gradient(90deg,#9d1822,#f04443 45%,#b71e28);box-shadow:0 8px 12px #0005;transition:left .09s}
.ej-car:before{content:"";position:absolute;top:15px;left:10px;right:10px;height:30px;border-radius:8px 8px 4px 4px;background:linear-gradient(#c4f2ff,#3986a4);border:2px solid #8e1d24}
.ej-car:after{content:"";position:absolute;bottom:9px;left:13px;right:13px;height:15px;border-radius:4px;background:#ffe58a;box-shadow:-17px 8px 0 -3px #15191d,17px 8px 0 -3px #15191d}
.ej-race-controls{position:absolute;z-index:6;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 13px;pointer-events:none}
.ej-race-controls button{pointer-events:auto;width:56px;height:48px;border:2px solid white;border-radius:14px;background:#ffffffdf;color:#263548;font-size:1.4rem;font-weight:900;touch-action:none}
.ej-race-overlay{position:absolute;z-index:8;inset:0;display:grid;place-items:center;background:#102a3b66}
.ej-race-overlay[hidden]{display:none}
.ej-race-feedback{position:absolute;z-index:7;top:36%;left:50%;translate:-50% -50%;padding:8px 15px;border-radius:18px;background:white;color:#238019;font-weight:1000;opacity:0}
.ej-race-feedback.show{animation:ej-pop .7s ease}
@keyframes ej-pop{20%,70%{opacity:1;scale:1.08}to{opacity:0;scale:.9}}
.ej-race-help{text-align:center;color:#64748b;font-size:.83rem}
@media(max-width:600px){.ej-race{min-height:520px}.ej-car{width:57px;height:94px}}

/* Estado de carregamento dos áudios dos flashcards. */
.ej-audio-button:disabled { cursor: not-allowed; opacity: .72; }
.ej-audio-button.is-loading { cursor: wait; opacity: 1; }
.ej-audio-button .fa-circle-o-notch { font-size: .95rem; }
    </style>
</head>
<body>
    <div id="mission-app"></div>
    <script type="module">
import {
    getCachedMissionSession,
    loginMissionUser,
    loadMissionSettings,
    recordMissionResult
} from "./components/config.js";
import {
    mountMissionLayout,
    setMissionUser,
    setMissionXP,
    setMissionProgress,
    setArtie,
    setMissionContent,
    showMissionDialog
} from "./components/layout.js";
import { playGoogleTTS } from "./components/tts.js";

const MISSION_NAME = "Days of a Week";

const days = [
    { en: "Monday", pt: "segunda-feira" },
    { en: "Tuesday", pt: "terça-feira" },
    { en: "Wednesday", pt: "quarta-feira" },
    { en: "Thursday", pt: "quinta-feira" },
    { en: "Friday", pt: "sexta-feira" },
    { en: "Saturday", pt: "sábado" },
    { en: "Sunday", pt: "domingo" }
];

const gameQuestions = [
    {
        prompt: "What day comes before Friday?",
        options: ["Thursday", "Saturday", "Monday"],
        answer: "Thursday",
        explanation: "Thursday comes right before Friday."
    },
    {
        prompt: "How do you say “domingo” in English?",
        options: ["Saturday", "Sunday", "Monday"],
        answer: "Sunday",
        explanation: "Sunday means domingo."
    },
    {
        prompt: "Which day is between Monday and Wednesday?",
        options: ["Tuesday", "Thursday", "Friday"],
        answer: "Tuesday",
        explanation: "Tuesday is between Monday and Wednesday."
    },
    {
        prompt: "Which spelling is correct?",
        options: ["Wensday", "Wednesday", "Wednsday"],
        answer: "Wednesday",
        explanation: "Wednesday is spelled W-E-D-N-E-S-D-A-Y."
    },
    {
        prompt: "What day comes after Saturday?",
        options: ["Friday", "Sunday", "Monday"],
        answer: "Sunday",
        explanation: "Sunday comes after Saturday."
    }
];

let studentSession = null;
let missionSettings = {
    registered: false,
    missionScore: null,
    alreadyAttempted: false,
    completed: false,
    failed: false
};
let gameIndex = 0;
let correctAnswers = 0;
let answerLocked = false;

function renderLoginScreen() {
    setMissionProgress("LOGIN", 1, 3, 0);
    setArtie("Hi! Entre com seu usuário do EnglishJourney. Se você já fez login no site, eu reconheceria sua sessão automaticamente.", "artie_waving_ClosedEyes_smiling.png");

    setMissionContent(`
        <span class="ej-kicker">WELCOME TO ENGLISHJOURNEY</span>
        <h1 class="ej-screen-title">Let’s learn English!</h1>
        <p class="ej-screen-copy">Entre com o mesmo usuário e senha que você utiliza no EnglishJourney para começar a missão <strong>Days of the Week</strong>.</p>
        <form id="mission-login-form" class="ej-login-form">
            <label>
                Username
                <input id="mission-login-username" name="username" type="text" autocomplete="username" required>
            </label>
            <label>
                Password
                <input id="mission-login-password" name="password" type="password" autocomplete="current-password" required>
            </label>
            <p id="mission-login-feedback" class="ej-login-feedback" role="alert"></p>
            <button class="ej-primary-button" type="submit">Start mission <span aria-hidden="true">→</span></button>
        </form>
    `);

    const form = document.getElementById("mission-login-form");
    form?.addEventListener("submit", async event => {
        event.preventDefault();

        const button = form.querySelector('button[type="submit"]');
        const feedback = document.getElementById("mission-login-feedback");
        const username = document.getElementById("mission-login-username")?.value;
        const password = document.getElementById("mission-login-password")?.value;

        if (button) {
            button.disabled = true;
            button.textContent = "Signing in...";
        }
        if (feedback) feedback.textContent = "";

        const result = await loginMissionUser(username, password);

        if (!result.session) {
            if (feedback) feedback.textContent = result.error || "Não foi possível entrar.";
            if (button) {
                button.disabled = false;
                button.innerHTML = 'Start mission <span aria-hidden="true">→</span>';
            }
            return;
        }

        await startMission(result.session);
    });
}

async function startMission(session) {
    studentSession = session;
    setMissionUser(session);
    setArtie("Great! Vamos aprender os dias da semana em inglês. Toque no alto-falante para ouvir cada palavra.", "artie_smiling_holding_chin.png");

    try {
        missionSettings = await loadMissionSettings(MISSION_NAME, session.username);
    } catch (error) {
        console.error("Não foi possível carregar a configuração da missão:", error);
        missionSettings = {
            registered: false,
            missionScore: null,
            alreadyAttempted: false,
            completed: false,
            failed: false
        };
    }

    setMissionXP(missionSettings.missionScore);
    renderLesson();
}

function renderLesson() {
    setMissionProgress("LESSON", 1, 3, 18);
    setArtie("Listen to each day and repeat it out loud. Vamos praticar juntos!", "artie_smiling_holding_chin.png");

    const missingMissionNotice = !missionSettings.registered
        ? `
            <div class="ej-info-strip ej-warning-strip">
                <span aria-hidden="true">ℹ️</span>
                <span>Esta missão ainda não foi cadastrada na tabela <strong>missions</strong>. Você pode testar a aula, mas o resultado e os pontos só serão registrados depois que a linha “Days of a Week” for adicionada.</span>
            </div>
        `
        : missionSettings.alreadyAttempted
            ? `
                <div class="ej-info-strip ej-warning-strip">
                    <span aria-hidden="true">🔁</span>
                    <span>Você já participou desta missão. Pode revisar e jogar novamente, mas uma nova tentativa não concede pontos.</span>
                </div>
            `
            : "";

    const cards = days.map(day => `
        <article class="ej-day-card">
            <span class="ej-day-name">${day.en}</span>
            <span class="ej-day-translation">${day.pt}</span>
            <button class="ej-audio-button" type="button" data-say="${day.en}" aria-label="Ouvir ${day.en}">🔊</button>
        </article>
    `).join("");

    setMissionContent(`
        <span class="ej-kicker">VOCABULARY • 01</span>
        <h1 class="ej-screen-title">Days of the Week</h1>
        <p class="ej-screen-copy">Em inglês, os dias da semana começam com letra maiúscula. Ouça cada palavra e observe a sequência de Monday a Sunday.</p>
        ${missingMissionNotice}
        <div class="ej-days-grid">${cards}</div>
        <div class="ej-info-strip">
            <span aria-hidden="true">💡</span>
            <span><strong>Remember:</strong> “week” significa semana. A expressão “days of the week” significa “dias da semana”.</span>
        </div>
        <div class="ej-button-row">
            <button id="start-mini-exercise" class="ej-primary-button" type="button">I’m ready! <span aria-hidden="true">→</span></button>
        </div>
    `);

    const audioButtons = [...document.querySelectorAll("[data-say]")];
    let audioLoading = false;

    audioButtons.forEach(button => {
        button.addEventListener("click", async () => {
            if (audioLoading || button.disabled) return;

            audioLoading = true;
            audioButtons.forEach(audioButton => {
                audioButton.disabled = true;
                if (audioButton === button) {
                    audioButton.classList.add("is-loading");
                    audioButton.setAttribute("aria-busy", "true");
                    audioButton.innerHTML = '<i class="fa fa-circle-o-notch fa-spin" aria-hidden="true"></i>';
                }
            });

            try {
                await playGoogleTTS(button.dataset.say);
            } catch (error) {
                console.error("Não foi possível reproduzir o áudio:", error);
            } finally {
                audioButtons.forEach(audioButton => {
                    audioButton.disabled = false;
                    if (audioButton === button) {
                        audioButton.classList.remove("is-loading");
                        audioButton.removeAttribute("aria-busy");
                        audioButton.innerHTML = "🔊";
                    }
                });
                audioLoading = false;
            }
        });
    });

    document.getElementById("start-mini-exercise")?.addEventListener("click", renderWarmup);
}


const exerciseQuestions = [
 {prompt:"Which day comes after Tuesday?",options:["Sunday","Wednesday","Friday"],answer:"Wednesday",explanation:"Wednesday comes after Tuesday."},
 {prompt:"What day comes before Friday?",options:["Thursday","Saturday","Monday"],answer:"Thursday",explanation:"Thursday comes right before Friday."}
];
let exerciseIndex=0, exerciseCorrect=0;
let raceScore=0,raceRunning=false,raceFrame=0,raceLast=0,raceSpawn=0,raceX=50,raceTarget=null,raceWords=[],racePointer=null;

function renderWarmup(){exerciseIndex=0;exerciseCorrect=0;renderExerciseQuestion();}
function renderExerciseQuestion(){
 const q=exerciseQuestions[exerciseIndex];
 setMissionProgress("EXERCISE",2,3,exerciseIndex?48:35);
 setArtie("Responda às duas questões para liberar o jogo!","artie_standing_smiling.png");
 setMissionContent(`
  <span class="ej-kicker">EXERCISE • QUESTION ${exerciseIndex+1} OF 2</span>
  <h1 class="ej-screen-title">Let’s practice!</h1>
  <p class="ej-screen-copy">Conclua as duas questões. Depois, você poderá jogar a corrida dos dias da semana.</p>
  <section class="ej-quiz-card"><p class="ej-question-number">QUESTION 0${exerciseIndex+1} / 02</p>
  <h2 class="ej-question-title">${q.prompt}</h2>
  <div class="ej-answer-list" id="exercise-answers">${q.options.map(x=>`<button class="ej-answer-option" type="button" data-exercise-answer="${x}">${x}</button>`).join("")}</div>
  <p id="exercise-feedback" class="ej-answer-feedback" aria-live="polite"></p>
  <div class="ej-button-row"><button id="exercise-next" class="ej-primary-button" type="button" hidden disabled>${exerciseIndex===1?"Go to game":"Continue"} <span aria-hidden="true">→</span></button></div></section>`);
 document.querySelectorAll("[data-exercise-answer]").forEach(btn=>btn.addEventListener("click",()=>{
  const opts=[...document.querySelectorAll("[data-exercise-answer]")];if(opts.some(x=>x.disabled))return;
  opts.forEach(x=>{x.disabled=true;if(x.dataset.exerciseAnswer===q.answer)x.classList.add("is-correct")});
  const ok=btn.dataset.exerciseAnswer===q.answer;if(ok){exerciseCorrect++;setArtie("Excellent! Você acertou!","artie_smiling_happy_clenched_fists.png")}else{btn.classList.add("is-wrong");setArtie("Quase! Observe a resposta correta e continue.","artie_sad.png")}
  document.getElementById("exercise-feedback").textContent=(ok?"Correct! ":"Not quite. ")+q.explanation;
  const next=document.getElementById("exercise-next");next.hidden=false;next.disabled=false;
 }));
 document.getElementById("exercise-next")?.addEventListener("click",()=>{if(exerciseIndex===0){exerciseIndex=1;renderExerciseQuestion()}else renderRaceIntro()});
}
function renderRaceIntro(){
 setMissionProgress("GAME",3,3,58);setArtie("Ready, driver? Encontre na pista a palavra em inglês que corresponde ao dia em português!","artie_smiling_pointing_right.png");
 setMissionContent(`
 <span class="ej-kicker">FINAL CHALLENGE • DAY RACER</span><h1 class="ej-screen-title">Let’s race!</h1>
 <p class="ej-screen-copy">Cada palavra correta vale um ponto. Alcance <strong>${missionSettings.missionScore??"—"}</strong> pontos para concluir a missão.</p>
 <div class="ej-race" id="ej-race">
  <div class="ej-race-sky"><i class="ej-cloud"></i><i class="ej-cloud"></i><i class="ej-cloud"></i></div><div class="ej-road"></div>
  <div class="ej-race-hud"><div>Encontre:<strong id="race-target">—</strong></div><div>SCORE<strong id="race-score">0</strong></div></div>
  <div class="ej-race-words" id="race-words"></div><div class="ej-car" id="race-car"></div>
  <div class="ej-race-feedback" id="race-feedback">+1</div>
  <div class="ej-race-controls"><button id="race-left" type="button" aria-label="Esquerda">←</button><button id="race-right" type="button" aria-label="Direita">→</button></div>
  <div class="ej-race-overlay" id="race-overlay"><button class="ej-primary-button" id="race-start" type="button">▶ Start</button></div>
 </div><p class="ej-race-help">Use ← →, A / D, os botões ou arraste o carro na tela.</p>`);
 raceScore=0;raceX=50;raceTarget=pickDay();raceWords=[];updateRaceHud();
 document.getElementById("race-start")?.addEventListener("click",startRace);
 const root=document.getElementById("ej-race");
 const move=x=>{raceX=Math.max(12,Math.min(88,x));const car=document.getElementById("race-car");if(car)car.style.left=raceX+"%"};
 document.getElementById("race-left")?.addEventListener("pointerdown",e=>{e.preventDefault();if(raceRunning)move(raceX-9)});
 document.getElementById("race-right")?.addEventListener("pointerdown",e=>{e.preventDefault();if(raceRunning)move(raceX+9)});
 root?.addEventListener("pointerdown",e=>{if(!raceRunning||e.target.closest("button"))return;racePointer=e.pointerId;root.setPointerCapture(e.pointerId);move((e.clientX-root.getBoundingClientRect().left)/root.clientWidth*100)});
 root?.addEventListener("pointermove",e=>{if(raceRunning&&racePointer===e.pointerId)move((e.clientX-root.getBoundingClientRect().left)/root.clientWidth*100)});
 const release=e=>{if(racePointer===e.pointerId)racePointer=null};root?.addEventListener("pointerup",release);root?.addEventListener("pointercancel",release);
}
function pickDay(){return days[Math.floor(Math.random()*days.length)]}
function updateRaceHud(){const t=document.getElementById("race-target"),s=document.getElementById("race-score");if(t)t.textContent=raceTarget.pt;if(s)s.textContent=String(raceScore)}
function startRace(){
 if(missionSettings.missionScore===null||missionSettings.missionScore<=0){showMissionDialog({title:"Mission not configured",message:"Configure a quantidade mínima de pontos em mission_score na tabela missions para iniciar esta corrida.",buttonText:"Back",tone:"warning",onAction:renderRaceIntro});return}
 raceRunning=true;raceLast=0;raceSpawn=0;document.getElementById("race-overlay").hidden=true;raceFrame=requestAnimationFrame(updateRace);
}
function spawnRaceWord(){
 const lane=[20,50,80][Math.floor(Math.random()*3)],day=pickDay(),el=document.createElement("div");
 el.className="ej-race-word";el.textContent=day.en;el.style.left=lane+"%";document.getElementById("race-words")?.append(el);
 raceWords.push({el,lane,day,y:-12,checked:false});
}
function updateRace(ts){
 if(!raceRunning)return;const dt=Math.min(40,ts-(raceLast||ts));raceLast=ts;raceSpawn+=dt;
 if(raceSpawn>1150){raceSpawn=0;spawnRaceWord()}
 raceWords=raceWords.filter(w=>{
  w.y+=dt*.055;w.el.style.top=w.y+"%";
  if(!w.checked&&w.y>=77){w.checked=true;if(Math.abs(w.lane-raceX)<16){
   if(w.day.en===raceTarget.en){raceScore++;updateRaceHud();const f=document.getElementById("race-feedback");if(f){f.textContent="+1";f.classList.remove("show");void f.offsetWidth;f.classList.add("show")}raceTarget=pickDay();updateRaceHud();if(raceScore>=Number(missionSettings.missionScore)){finishRace();}}
   else{const f=document.getElementById("race-feedback");if(f){f.textContent="Try again!";f.classList.remove("show");void f.offsetWidth;f.classList.add("show")}}
  }}
  if(w.y>112){w.el.remove();return false}return true;
 });
 if(raceRunning)raceFrame=requestAnimationFrame(updateRace);
}
function onRaceKey(e){if(!raceRunning)return;const k=e.key.toLowerCase();if(["arrowleft","arrowright","a","d"].includes(k))e.preventDefault();if(k==="arrowleft"||k==="a")raceX=Math.max(12,raceX-3);if(k==="arrowright"||k==="d")raceX=Math.min(88,raceX+3);const c=document.getElementById("race-car");if(c)c.style.left=raceX+"%"}
window.addEventListener("keydown",onRaceKey);
function finishRace(){raceRunning=false;cancelAnimationFrame(raceFrame);window.removeEventListener("keydown",onRaceKey);setArtie("You did it! Parabéns pela conquista!","artie_smiling_happy_clenched_fists.png");completeGame(true)}

async function completeGame(passed) {
 let result=null,error=null;
 try{result=await recordMissionResult(MISSION_NAME,studentSession.username,passed?"done":"fail")}catch(e){error=e;console.error(e)}
 if(result?.recorded&&passed){missionSettings.alreadyAttempted=true;missionSettings.completed=true;setMissionXP(result.earnedPoints)}
 const message=error?"Não foi possível registrar o resultado: "+error.message:result?.reason==="already-attempted"?"Esta missão já teve uma tentativa registrada.": "Você alcançou "+raceScore+" pontos e concluiu a missão! Parabéns!";
 showMissionDialog({title:passed?"Mission completed!":"Keep practicing!",message,buttonText:passed&&result?.recorded?"Next mission":"Review",tone:passed?"success":"warning",onAction:()=>{
  if(passed&&result?.recorded){
   setMissionContent('<h1 class="ej-screen-title">Congratulations!</h1><p class="ej-screen-copy">Missão concluída! Carregando a próxima etapa...</p>');
   window.parent.postMessage({type:"ENGLISHJOURNEY_MISSION_COMPLETED",missionName:MISSION_NAME},window.location.origin);
  }else renderLesson();
 }});
}

mountMissionLayout();

const cachedSession = getCachedMissionSession();
if (cachedSession) {
    startMission(cachedSession);
} else {
    renderLoginScreen();
}

    </script>
</body>
</html>
