function shuffleArray(items) {
    const shuffled = items.slice();
    for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        const temporary = shuffled[index];
        shuffled[index] = shuffled[randomIndex];
        shuffled[randomIndex] = temporary;
    }
    return shuffled;
}

function updateProgress(label) {
    const percent = Math.round((answeredQuestions / TOTAL_QUESTIONS) * 100);
    setMissionProgress(label, answeredQuestions, TOTAL_QUESTIONS, percent);

function getRequiredScore() {
    const configured = Number(missionSettings.missionScore);
    return missionSettings.registered && Number.isFinite(configured) && configured > 0

        : DEFAULT_REQUIRED_SCORE;
}

function renderLoginScreen() {
    setMissionProgress("LOGIN", 0, TOTAL_QUESTIONS, 0);
    setArtie("Hi! Entre com seu usuário do EnglishJourney. Se você já fez login no site, eu reconhecerei sua sessão automaticamente.", "artie_waving_ClosedEyes_smiling.png");

    setMissionContent(

        '<h1 class="ej-screen-title">Let’s learn English!</h1>' +
        '<p class="ej-screen-copy">Entre com o mesmo usuário e senha que você utiliza no EnglishJourney para começar a missão <strong>Prices</strong>.</p>' +
        '<form id="mission-login-form" class="ej-login-form">' +
            '<label>Username<input id="mission-login-username" name="username" type="text" autocomplete="username" required></label>' +
            '<label>Password<input id="mission-login-password" name="password" type="password" autocomplete="current-password" required></label>' +
            '<p id="mission-login-feedback" class="ej-login-feedback" role="alert"></p>' +
            '<button class="ej-primary-button" type="submit">Start mission <span aria-hidden="true">→</span></button>' +
        '</form>'
    );

    const form = document.getElementById("mission-login-form");
    form?.addEventListener("submit", async function(event) {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        const feedback = document.getElementById("mission-login-feedback");
        const username = document.getElementById("mission-login-username")?.value;
        const password = document.getElementById("mission-login-password")?.value;

        if (button) {
            button.disabled = true;
            button.textContent = "Signing in...";
        }
        if (feedback) feedback.textContent = "";

        const result = await loginMissionUser(username, password);
        if (!result.session) {
            if (feedback) feedback.textContent = result.error || "Não foi possível entrar.";
            if (button) {
                button.disabled = false;
                button.innerHTML = 'Start mission <span aria-hidden="true">→</span>';
            }
            return;
        }
        await startMission(result.session);
    });
}

async function startMission(session) {
    studentSession = session;
    setMissionUser(session);
    setArtie("Welcome! Hoje vamos aprender a falar sobre dinheiro, preços e formas de pagamento em inglês.", "artie_smiling_holding_chin.png");

    try {
        missionSettings = await loadMissionSettings(MISSION_NAME, session.username);
    } catch (error) {
        console.error("Não foi possível carregar a configuração da missão:", error);
        missionSettings = {
            registered: false,
            missionScore: null,
            alreadyAttempted: false,
            completed: false,
            failed: false
        };
    }

    setMissionReward(
        missionSettings.completed,
        missionSettings.failed,
        missionSettings.registered && Number(missionSettings.missionScore) > 0
    );
    renderVocabularyQuestion();
}

        button.addEventListener("click", async function() {
            if (audioBusy || button.disabled) return;
            audioBusy = true;
            const audioButtons = Array.from(document.querySelectorAll("#mission-content [data-say]"));
            audioButtons.forEach(function(audioButton) {
                audioButton.disabled = true;
                if (audioButton === button) {
                    audioButton.classList.add("is-loading");
                    audioButton.setAttribute("aria-busy", "true");
                    audioButton.innerHTML = '<i class="fa fa-circle-o-notch fa-spin" aria-hidden="true"></i>';
                }
            });

            try {
                await playGoogleTTS(button.dataset.say);
            } catch (error) {
                console.error("Não foi possível reproduzir o áudio:", error);
            } finally {
                audioButtons.forEach(function(audioButton) {
                    audioButton.disabled = false;
                    if (audioButton === button) {
                        audioButton.classList.remove("is-loading");
                        audioButton.removeAttribute("aria-busy");
                        audioButton.innerHTML = "🔊";
                    }
                });
                audioBusy = false;
            }
        });
    });
}

function renderIllustration(iconName) {
    return '<svg viewBox="0 0 240 135" role="img" aria-label="Illustration for a money and shopping word" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="7" y="7" width="226" height="121" rx="15" fill="#f7fbff"/>' +
        illustrations[iconName] +
        '</svg>';
}

function renderVocabularyQuestion() {
    const item = vocabulary[vocabularyIndex];
    const choices = shuffleArray([item.term].concat(item.distractors));
    const choiceButtons = choices.map(function(choice) {
        return '<button class="ej-match-option" type="button" data-vocab-choice="' + choice + '">' + choice + '</button>';
    }).join("");
    const dots = vocabulary.map(function(_, index) {
        const classes = index < vocabularyIndex ? "is-done" : index === vocabularyIndex ? "is-current" : "";
        return '<span class="' + classes + '" aria-hidden="true"></span>';
    }).join("");

    updateProgress("LESSON 1 • MONEY WORDS");
    setArtie("Observe a imagem e escolha a palavra correta. As outras opções são palavras que você já encontrou em missões anteriores.", "artie_smiling_pointing_right.png");

    setMissionContent(
        '<span class="ej-kicker">LESSON 1 • MONEY VOCABULARY</span>' +
        '<h1 class="ej-screen-title">Money words</h1>' +
        '<p class="ej-screen-copy">Vamos conhecer palavras usadas em compras e pagamentos. Veja cada ilustração e escolha o nome correto entre as três opções.</p>' +
        getMissionNotice() +
        '<div class="ej-price-word-progress" aria-label="Progresso do vocabulário">' + dots + '</div>' +
        '<section class="ej-price-match-card">' +
            '<p class="ej-question-number">WORD ' + (vocabularyIndex + 1) + ' / ' + vocabulary.length + '</p>' +
            '<div class="ej-price-match-image">' + renderIllustration(item.icon) + '</div>' +
            '<p class="ej-screen-copy">Which word matches the picture?</p>' +
            '<div class="ej-price-match-options" id="vocabulary-options">' + choiceButtons + '</div>' +
            '<p id="vocabulary-feedback" class="ej-price-feedback" aria-live="polite"></p>' +
            '<div class="ej-button-row"><button id="vocabulary-next" class="ej-primary-button" type="button" hidden disabled>' +
                (vocabularyIndex === vocabulary.length - 1 ? "Continue to lesson 2" : "Next word") +
                ' <span aria-hidden="true">→</span></button></div>' +
        '</section>'
    );

    document.querySelectorAll("[data-vocab-choice]").forEach(function(button) {
        button.addEventListener("click", function() {
            const allOptions = Array.from(document.querySelectorAll("[data-vocab-choice]"));
            if (allOptions.some(function(option) { return option.disabled; })) return;

            const correct = button.dataset.vocabChoice === item.term;
            allOptions.forEach(function(option) {
                option.disabled = true;
                if (option.dataset.vocabChoice === item.term) option.classList.add("is-correct");
            });
            if (!correct) button.classList.add("is-wrong");

            playAnswerSound(correct);
            answeredQuestions += 1;
            if (correct) {
                correctAnswers += 1;
                setArtie("Correct! " + item.term + ". " + item.meaning, "artie_smiling_happy_clenched_fists.png");
            } else {
                setArtie("A resposta correta é " + item.term + ". " + item.meaning, "artie_smiling_holding_chin.png");
            }

            const feedback = document.getElementById("vocabulary-feedback");
            if (feedback) feedback.textContent = (correct ? "Correct! " : "The correct word is " + item.term + ". ") + item.meaning;
            updateProgress("LESSON 1 • MONEY WORDS");

            const next = document.getElementById("vocabulary-next");
            if (next) {
                next.hidden = false;
                next.disabled = false;
            }
        });
    });

    bindAudioButtons();
    document.getElementById("vocabulary-next")?.addEventListener("click", function() {
        if (vocabularyIndex < vocabulary.length - 1) {
            vocabularyIndex += 1;
            renderVocabularyQuestion();
        } else {
            renderShoppingLesson();
        }
    });
}

function renderPhraseCard(phrase, translation) {
    return '<div class="ej-price-phrase">' +
        '<div><strong>' + phrase + '</strong><small>' + translation + '</small></div>' +
        '<button class="ej-audio-button" type="button" data-say="' + phrase.replace(/"/g, "&quot;") + '" aria-label="Listen to ' + phrase.replace(/"/g, "&quot;") + '">🔊</button>' +
    '</div>';
}

function renderShoppingLesson() {
    updateProgress("LESSON 2 • SHOPPING");
    setArtie("Agora que você conhece as palavras sobre dinheiro, vamos aprender a perguntar preços e responder no caixa.", "artie_smiling_holding_chin.png");

    setMissionContent(
        '<span class="ej-kicker">LESSON 2 • ASKING AND ANSWERING</span>' +
        '<h1 class="ej-screen-title">How much is it?</h1>' +
        '<p class="ej-screen-copy">Em uma loja ou supermercado, usamos estas perguntas para descobrir o preço de um produto. Toque no alto-falante para ouvir e repetir.</p>' +
        '<div class="ej-phrase-group">' +
            '<h2>Asking about prices</h2>' +
            renderPhraseCard("How much is it?", "Quanto custa? / Quanto é?") +
            renderPhraseCard("How much does it cost?", "Quanto isso custa?") +
            renderPhraseCard("How much is this T-shirt?", "Quanto custa esta camiseta?") +
        '</div>' +
        '<div class="ej-info-strip"><span aria-hidden="true">💡</span><span><strong>How much</strong> é usado para perguntar o preço. Use <strong>this</strong> quando estiver apontando para algo perto de você: <em>this T-shirt</em>.</span></div>' +
        '<div class="ej-phrase-group">' +
            '<h2>Answering about prices</h2>' +
            renderPhraseCard("It's five dollars.", "São cinco dólares.") +
            renderPhraseCard("It's just a penny.", "É só um centavo.") +
            renderPhraseCard("It is only twenty-four dollars.", "Custa apenas vinte e quatro dólares.") +
        '</div>' +
        '<div class="ej-phrase-group">' +
            '<h2>At the checkout</h2>' +
            renderPhraseCard("Would you like to pay by credit card or cash?", "Você gostaria de pagar com cartão de crédito ou dinheiro?") +
            renderPhraseCard("Cash or card?", "Dinheiro ou cartão?") +
        '</div>' +
        '<div class="ej-price-example"><strong>Mini conversation</strong><p>Customer: How much is this T-shirt?<br>Seller: It's twenty-four dollars.<br>Customer: Can I pay by card?<br>Seller: Yes, of course!</p></div>' +
        '<div class="ej-price-summary-grid">' +
            '<div class="ej-price-summary-item"><strong>How much?</strong><span>ASK THE PRICE</span></div>' +
            '<div class="ej-price-summary-item"><strong>It's...</strong><span>GIVE THE PRICE</span></div>' +
            '<div class="ej-price-summary-item"><strong>Cash or card?</strong><span>CHOOSE PAYMENT</span></div>' +
        '</div>' +
        '<div class="ej-info-strip"><span aria-hidden="true">🎧</span><span>Depois da revisão, você vai praticar as frases e assistir a uma conversa curta em um supermercado.</span></div>' +
        '<div class="ej-button-row"><button id="start-prices-assessment" class="ej-primary-button" type="button">Let’s practice! <span aria-hidden="true">→</span></button></div>'
    );

    bindAudioButtons();
    document.getElementById("start-prices-assessment")?.addEventListener("click", function() {
        assessmentIndex = 0;
        renderAssessmentQuestion();
    });
}

function renderAssessmentQuestion() {
    const question = priceQuestions[assessmentIndex];
    const options = question.options.map(function(option) {
        return '<button class="ej-answer-option" type="button" data-answer="' + option.replace(/"/g, "&quot;") + '">' + option + '</button>';
    }).join("");

    updateProgress(question.section);
    setArtie(
        assessmentIndex < 3
            ? "Escolha a pergunta que melhor combina com a situação."
            : assessmentIndex < 8
                ? "Leia a situação e escolha a resposta correta. Você está quase terminando!"
                : "Assista ao vídeo com atenção e depois responda à pergunta sobre a conversa.",
        "artie_standing_smiling.png"
    );

    const video = question.video
        ? '<p class="ej-video-caption">Watch the supermarket conversation.</p>' +
          '<div class="ej-price-video"><iframe src="https://www.youtube.com/embed/PSXltD4HoFY?rel=0" title="Supermarket conversation: asking about prices" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'
        : "";
    const audio = question.audio
        ? '<div class="ej-question-audio"><button class="ej-audio-button" type="button" data-say="' + question.audio.replace(/"/g, "&quot;") + '" aria-label="Listen to the phrase">🔊</button><span>Listen to the phrase</span></div>'
        : "";

    setMissionContent(
        '<span class="ej-kicker">PRACTICE • ' + question.section + '</span>' +
        '<h1 class="ej-screen-title">Let’s practice!</h1>' +
        '<p class="ej-screen-copy">Escolha uma das três alternativas. Você receberá feedback depois de responder.</p>' +
        '<section class="ej-quiz-card">' +
            '<p class="ej-question-number">QUESTION ' + String(assessmentIndex + 13).padStart(2, "0") + ' / ' + TOTAL_QUESTIONS + '</p>' +
            (question.video ? '<span class="ej-price-question-tag">🎬 Listening comprehension</span>' : '') +
            video +
            '<h2 class="ej-question-title">' + question.prompt + '</h2>' +
            audio +
            '<div class="ej-answer-list ej-price-quiz-options" id="question-answers">' + options + '</div>' +
            '<p id="question-feedback" class="ej-answer-feedback" aria-live="polite"></p>' +
            '<div class="ej-button-row"><button id="question-next" class="ej-primary-button" type="button" hidden disabled>' +
                (assessmentIndex === priceQuestions.length - 1 ? "See my result" : "Continue") +
                ' <span aria-hidden="true">→</span></button></div>' +
        '</section>'
    );

    bindAudioButtons();
    document.querySelectorAll("[data-answer]").forEach(function(button) {
        button.addEventListener("click", function() {
            const allOptions = Array.from(document.querySelectorAll("[data-answer]"));
            if (allOptions.some(function(option) { return option.disabled; })) return;

            const correct = button.dataset.answer === question.answer;
            allOptions.forEach(function(option) {
                option.disabled = true;
                if (option.dataset.answer === question.answer) option.classList.add("is-correct");
            });
            if (!correct) button.classList.add("is-wrong");

            playAnswerSound(correct);
            answeredQuestions += 1;
            if (correct) {
                correctAnswers += 1;
                setArtie("Excellent! Você escolheu a resposta correta.", "artie_smiling_happy_clenched_fists.png");
            } else {
                setArtie("Quase! Leia a explicação e continue praticando.", "artie_smiling_holding_chin.png");
            }

            const feedback = document.getElementById("question-feedback");
            if (feedback) feedback.textContent = (correct ? "Correct! " : "Not quite. ") + question.explanation;
            updateProgress(question.section);

            const next = document.getElementById("question-next");
            if (next) {
                next.hidden = false;
                next.disabled = false;
            }
        });
    });

    document.getElementById("question-next")?.addEventListener("click", function() {
        if (assessmentIndex < priceQuestions.length - 1) {
            assessmentIndex += 1;
            renderAssessmentQuestion();
        } else {
            finishAssessment();
        }
    });
}

function resetMission() {
    vocabularyIndex = 0;
    assessmentIndex = 0;
    correctAnswers = 0;
    answeredQuestions = 0;
    renderVocabularyQuestion();
}

function renderRetryScreen(score, target) {
    updateProgress("REVIEW");
    setArtie("Você está perto! Revise as palavras e frases e tente novamente. Cada tentativa ajuda você a aprender.", "artie_smiling_holding_chin.png");
    setMissionContent(
        '<span class="ej-kicker">KEEP PRACTICING</span>' +
        '<h1 class="ej-screen-title">Good effort!</h1>' +
        '<p class="ej-screen-copy">Você acertou <strong>' + correctAnswers + ' de ' + TOTAL_QUESTIONS + '</strong> questões e alcançou <strong>' + score + '%</strong>. A meta desta missão é <strong>' + target + '%</strong>.</p>' +
        '<div class="ej-score-summary">' +
            '<div class="ej-summary-item"><strong>' + correctAnswers + ' / ' + TOTAL_QUESTIONS + '</strong><span>Correct answers</span></div>' +
            '<div class="ej-summary-item"><strong>' + score + '%</strong><span>Your score</span></div>' +
            '<div class="ej-summary-item"><strong>' + target + '%</strong><span>Mission goal</span></div>' +
        '</div>' +
        '<div class="ej-info-strip"><span aria-hidden="true">💡</span><span>Revise as ilustrações de money vocabulary, as perguntas sobre preços e as respostas usadas no caixa. Depois, tente novamente.</span></div>' +
        '<div class="ej-button-row"><button id="retry-mission" class="ej-primary-button" type="button">Review and try again <span aria-hidden="true">→</span></button></div>'
    );
    document.getElementById("retry-mission")?.addEventListener("click", resetMission);
}

async function finishAssessment() {
    const score = Math.round((correctAnswers / TOTAL_QUESTIONS) * 100);
    const target = getRequiredScore();
    updateProgress("COMPLETED");

    if (score < target) {
        renderRetryScreen(score, target);
        return;
    }

    setArtie("You did it! Você concluiu as atividades sobre preços e pagamentos. Vamos conferir o registro da sua missão.", "artie_smiling_happy_clenched_fists.png");

    if (!missionSettings.registered) {
        renderUnregisteredResult(score);
        return;
    }
    if (missionSettings.alreadyAttempted) {
        renderAlreadyAttemptedResult(score);
        return;
    }

    let result = null;
    let error = null;
    try {
        result = await recordMissionResult(MISSION_NAME, studentSession.username, "done");
    } catch (caughtError) {
        error = caughtError;
        console.error("Erro ao registrar a conclusão da missão:", caughtError);
    }

    if (result && result.recorded) {
        missionSettings.alreadyAttempted = true;
        missionSettings.completed = true;
        missionSettings.failed = false;
        setMissionReward(true, false);
        setMissionContent(
            '<span class="ej-kicker">MISSION COMPLETED</span>' +
            '<h1 class="ej-screen-title">Congratulations! 🎉</h1>' +
            '<p class="ej-screen-copy">Você acertou <strong>' + correctAnswers + ' de ' + TOTAL_QUESTIONS + '</strong> questões, alcançou <strong>' + score + '%</strong> e recebeu <strong>+2 estrelas</strong> na sua conta!</p>' +
            '<div class="ej-score-summary"><div class="ej-summary-item"><strong>' + correctAnswers + ' / ' + TOTAL_QUESTIONS + '</strong><span>Correct answers</span></div><div class="ej-summary-item"><strong>' + score + '%</strong><span>Final score</span></div><div class="ej-summary-item"><strong>+2 ⭐</strong><span>Reward</span></div></div>'
        );
        window.setTimeout(function() {
            window.parent.postMessage({
                type: "ENGLISHJOURNEY_MISSION_COMPLETED",
                missionName: MISSION_NAME
            }, window.location.origin);
        }, 1600);
        return;
    }

    let message = "Não foi possível registrar a conclusão. Tente novamente.";
    if (error) {
        message = error.message || message;
    } else if (result && result.reason === "already-attempted") {
        message = "Você já tentou ou concluiu esta missão. A recompensa de duas estrelas só pode ser recebida uma vez.";
    } else if (result && result.reason === "user-ambiguous") {
        message = "Encontramos mais de um cadastro com este usuário. Peça ao professor para corrigir o cadastro.";
    } else if (result && result.reason === "mission-not-registered") {
        message = "Esta missão ainda não foi cadastrada no banco de dados.";
    } else if (result && result.recorded === false) {
        message = "Não foi possível registrar a conclusão (" + (result.reason || "erro desconhecido") + ").";
    }

    showMissionDialog({
        title: "Almost there!",
        message: message + " Seu resultado foi " + score + "%. Você pode revisar as lições e tentar novamente.",
        buttonText: "Review",
        tone: "warning",
        onAction: resetMission
    });
}

function renderUnregisteredResult(score) {
    setMissionContent(
        '<span class="ej-kicker">PRACTICE COMPLETED</span>' +
        '<h1 class="ej-screen-title">Well done! ⭐</h1>' +
        '<p class="ej-screen-copy">Você acertou <strong>' + correctAnswers + ' de ' + TOTAL_QUESTIONS + '</strong> questões e alcançou <strong>' + score + '%</strong>. O conteúdo foi concluído, mas esta missão ainda não está cadastrada no banco de dados; por isso, as estrelas não puderam ser registradas.</p>' +
        '<div class="ej-info-strip ej-warning-strip"><span aria-hidden="true">ℹ️</span><span>Quando “Prices” for adicionada à tabela <strong>missions</strong>, a conclusão poderá ser registrada normalmente.</span></div>' +
        '<div class="ej-button-row"><button id="review-unregistered" class="ej-primary-button" type="button">Review lessons <span aria-hidden="true">→</span></button></div>'
    );
    document.getElementById("review-unregistered")?.addEventListener("click", resetMission);
}

function renderAlreadyAttemptedResult(score) {
    setMissionContent(
        '<span class="ej-kicker">PRACTICE COMPLETED</span>' +
        '<h1 class="ej-screen-title">Great review! 🎉</h1>' +
        '<p class="ej-screen-copy">Você alcançou ' + score + '% e revisou o conteúdo. A missão já foi tentada ou concluída anteriormente, então esta repetição não gera novas estrelas.</p>' +
        '<div class="ej-score-summary"><div class="ej-summary-item"><strong>' + correctAnswers + ' / ' + TOTAL_QUESTIONS + '</strong><span>Correct answers</span></div><div class="ej-summary-item"><strong>' + score + '%</strong><span>Review score</span></div></div>' +
        '<div class="ej-button-row"><button id="review-completed" class="ej-primary-button" type="button">Review lessons <span aria-hidden="true">→</span></button></div>'
    );
    document.getElementById("review-completed")?.addEventListener("click", resetMission);
}

mountMissionLayout({ missionNumber: MISSION_NUMBER });

const cachedSession = getCachedMissionSession();
if (cachedSession) {
    startMission(cachedSession);
} else {
    renderLoginScreen();
}
    </script>
