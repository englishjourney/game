<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Yuki - Tutor de Inglês</title>
  <link id="theme-stylesheet" rel="stylesheet" href="style.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ESTILOS DO MODAL DE LOGIN INTEGRADOS -->
  <style>
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 15, 20, 0.9); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; /* Fica acima de tudo */
    }
    .login-box {
      background: #1e1e2e; padding: 30px; border-radius: 16px; 
      width: 90%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; align-items: center;
      text-align: center; border: 2px solid #a855f7; /* Borda Tech Roxa */
    }
    .login-box img {
      width: 90px; height: 90px; border-radius: 50%; border: 3px solid #a855f7;
      margin-bottom: 15px; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }
    .login-box h3 { color: #fff; margin-bottom: 10px; font-family: sans-serif; }
    .login-box p { color: #b3b3bd; margin-bottom: 25px; font-size: 15px; font-family: sans-serif; line-height: 1.4; }
    .login-input {
      width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; 
      border: 1px solid #444; background: #2a2a35; color: #fff; 
      font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s;
    }
    .login-input:focus { border-color: #a855f7; box-shadow: 0 0 8px rgba(168, 85, 247, 0.3); }
    .login-btn {
      width: 100%; padding: 14px; border-radius: 8px; border: none;
      background: #a855f7; color: white; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: 0.3s;
    }
    .login-btn:hover { background: #9333ea; }
    .login-error { color: #ff4d4d; font-size: 14px; margin-top: 15px; display: none; font-weight: bold;}
  </style>
</head>
<body>

  <!-- MODAL DE LOGIN DO YUKI -->
  <div id="login-overlay">
    <div class="login-box">
      <img src="/game/Yuki/yuki.png" alt="Yuki">
      <h3>Hello! I am Yuki.</h3>
      <p>Para começarmos a nossa conversa, por favor, faça o seu login abaixo:</p>
      <form id="login-form" style="width: 100%;">
        <input type="text" id="login-username" class="login-input" placeholder="Seu Usuário (Username)" required>
        <input type="password" id="login-password" class="login-input" placeholder="Sua Senha" required>
        <button type="submit" class="login-btn">Entrar no Chat</button>
        <div id="login-error" class="login-error">Usuário ou senha incorretos!</div>
      </form>
    </div>
  </div>
  <!-- FIM MODAL DE LOGIN -->

  <div class="chat-container">
    <!-- Cabeçalho -->
    <header class="chat-header">
      <div class="avatar-container">
        <img src="/game/Yuki/yuki.png" alt="Yuki Avatar" class="avatar-img">
      </div>
      <div class="header-info">
        <h2>Yuki</h2>
        <span class="status-online">Online</span>
      </div>
    </header>

    <!-- Área de Mensagens -->
    <main class="chat-messages" id="chat-messages"></main>

    <!-- Campo de Entrada -->
    <footer class="chat-input-area">
      <form id="chat-form">
        <textarea id="user-input" placeholder="Digite sua dúvida ou resposta..." rows="1" required></textarea>
        <button type="submit" id="send-btn">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- A ORDEM AQUI IMPORTA -->
  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
