<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Journey</title>
    <!-- CSS Global (Padrão: 6º ao 9º ano / Estética Brawl Stars) -->
    <link rel="stylesheet" href="global.css" id="theme-global">
    <!-- CSS do Ensino Médio (Carregado dinamicamente via JS) -->
    <link rel="stylesheet" href="" id="theme-highschool">
</head>
<body>
<!-- Fundos Animados -->
    <div class="background-anim"></div>
    <div class="shooting-star"></div>
    <!-- ================= TELA DE LOGIN / CADASTRO ================= -->
    <main id="auth-screen" class="screen-container">
        <div class="auth-box">
            <h1>Login</h1>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Usuário" required>
                <input type="password" id="login-password" placeholder="Senha" required>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            <p>Ainda não possui conta? <button id="btn-show-register" type="button" class="btn-text">Crie uma</button></p>
        </div>

        <div class="auth-box hidden" id="register-box">
            <h1>Cadastro</h1>
            <form id="register-form">
                <input type="text" id="reg-name" placeholder="Nome Completo" required>
                <input type="text" id="reg-username" placeholder="Nome de usuário (ex: joao_silva)" required>
                <small>Apenas letras minúsculas, números, -, _ e .</small>
                <input type="password" id="reg-password" placeholder="Senha" required>
                
                <select id="reg-serie" required>
                    <option value="" disabled selected>Selecione a Série</option>
                    <option value="6">6º Ano</option>
                    <option value="7">7º Ano</option>
                    <option value="8">8º Ano</option>
                    <option value="9">9º Ano</option>
                    <option value="1">1º Ano E.M.</option>
                    <option value="2">2º Ano E.M.</option>
                    <option value="3">3º Ano E.M.</option>
                </select>

                <select id="reg-team" required>
                    <option value="" disabled selected>Selecione a Turma</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>

                <button type="submit" class="btn-primary">Cadastrar</button>
                <button type="button" id="btn-show-login" type="button">Voltar ao Login</button>
            </form>
        </div>
    </main>

    <!-- ================= INTERFACE PRINCIPAL (Logado) ================= -->
    <main id="app-screen" class="screen-container hidden">
        <header class="app-header">
            <div class="logo-container">
                <img id="app-logo" src="logoarcade.png" alt="Logo do Jogo">
            </div>
            <div class="profile-container">
                <button id="btn-avatar">
                    <img id="user-avatar" src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcS-55RgG38bJTopB10KrZknHMZMf94R5cEbUh8ZqWe8wiBmCyJE" alt="Avatar do Estudante">
                </button>
                <button id="btn-logout" class="btn-small">Sair</button>
            </div>
        </header>

        <section class="menu-options">
            <button class="menu-btn" id="btn-missions">Missões</button>
            <button class="menu-btn" id="btn-ranking">Ranking</button>
            <button class="menu-btn" id="btn-superstars">SuperStars</button>
        </section>
    </main>

    <!-- ================= JANELAS DE CONTEÚDO (Dialog) ================= -->
    <dialog id="content-modal" class="fullscreen-dialog">
        <div class="dialog-wrapper">
            <button id="btn-close-modal" class="btn-close">X</button>
            <div id="modal-content">
                <!-- O conteúdo (missões, ranking, etc.) será injetado aqui via JS -->
            </div>
        </div>
    </dialog>

    <!-- Scripts Modulares -->
    <script type="module" src="main.js"></script>
</body>
</html>
