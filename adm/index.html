<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof. Mica - Planejamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- TELA DE LOGIN ADM -->
    <div id="login-container">
        <form id="login-form">
            <h2>Acesso Administrativo</h2>
            <input type="password" id="adm-password" placeholder="Senha do micael.svg" required>
            <button type="submit">Entrar</button>
            <div id="login-error"></div>
        </form>
    </div>

    <!-- PAINEL ADM (Oculto inicialmente) -->
    <div id="adm-panel" class="hidden">
        <header>
            <h1>Prof. Mica - Planejamentos</h1>
            <div class="header-controls">
                <label class="switch-container">
                    <span>Permitir acesso em casa</span>
                    <label class="switch">
                        <input type="checkbox" id="home-access-toggle">
                        <span class="slider round"></span>
                    </label>
                </label>
                <button id="btn-logout" class="btn-danger">Sair</button>
            </div>
        </header>

        <nav>
            <button class="nav-btn active" data-target="dashboard-section">Dashboard</button>
            <button class="nav-btn" data-target="planner-section">Planejamentos</button>
            <button class="nav-btn" data-target="users-section">Usuários</button>
            <button class="nav-btn" data-target="missions-section">Missões</button>
            <button class="nav-btn" data-target="flashcards-section">Flashcards</button>
        </nav>

        <main>
            <!-- DASHBOARD SECTION -->
            <section id="dashboard-section" class="content-section active">
                <div class="section-header" style="flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between;">
                    <h2>Horários Semanais</h2>
                    <div class="search-bar" style="margin-bottom: 0; flex: 1; max-width: 350px; position: relative;">
                        <input type="text" id="global-search" placeholder="Pesquisar alunos ou planejamentos..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: white;">
                        <div id="search-results" class="hidden" style="position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-top: 5px; max-height: 300px; overflow-y: auto; z-index: 20;"></div>
                    </div>
                </div>
                <div id="schedule-container" style="margin-top: 20px;">
                    <!-- Preenchido dinamicamente via JS -->
                </div>
            </section>

            <!-- PLANNER SECTION -->
            <section id="planner-section" class="content-section hidden">
                <div class="section-header" style="flex-wrap: wrap; gap: 15px;">
                    <h2>Aulas Planejadas</h2>
                    <div class="search-bar" style="margin-bottom: 0; flex: 1; min-width: 250px; position: relative;">
                        <input type="text" id="planner-search" placeholder="Pesquisar por data, hora ou turma..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: white;">
                        <div id="planner-search-results" class="hidden" style="position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-top: 5px; max-height: 300px; overflow-y: auto; z-index: 20;"></div>
                    </div>
                    <button id="btn-add-plan" class="btn-primary">+ Nova Aula</button>
                </div>
                <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
                    <label class="switch-container" style="font-size: 0.9rem; cursor: pointer;">
                        <span>Última turma</span>
                        <label class="switch">
                            <input type="checkbox" id="last-team-toggle">
                            <span class="slider round"></span>
                        </label>
                    </label>
                </div>
                <div id="planner-list" class="cards-container">
                    <!-- Preenchido via JS -->
                </div>
            </section>

            <!-- USERS SECTION -->
            <section id="users-section" class="content-section hidden">
                <div class="section-header" style="flex-wrap: wrap; gap: 15px;">
                    <h2>Gerenciamento de Alunos</h2>
                    <div class="search-bar" style="margin-bottom: 0; flex: 1; min-width: 250px; position: relative;">
                        <input type="text" id="users-search" placeholder="Pesquisar aluno diretamente..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: white;">
                        <div id="users-search-results" class="hidden" style="position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-top: 5px; max-height: 300px; overflow-y: auto; z-index: 20;"></div>
                    </div>
                </div>
                <div id="users-container"></div>
            </section>

            <!-- MISSIONS SECTION -->
            <section id="missions-section" class="content-section hidden">
                 <div class="section-header">
                    <h2>Missões</h2>
                    <button id="btn-add-mission" class="btn-primary">+ Nova Missão</button>
                </div>
                <div id="missions-list" class="cards-container">
                    <!-- Preenchido via JS -->
                </div>
            </section>

            <!-- FLASHCARDS SECTION -->
            <section id="flashcards-section" class="content-section hidden">
                <div class="section-header">
                    <h2>Gerenciamento de Flashcards</h2>
                    <button id="btn-add-flashcard" class="btn-primary">+ Novo Flashcard</button>
                </div>
                <div id="flashcards-list" class="cards-container">
                    <!-- Preenchido via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL PLANNER -->
    <dialog id="planner-modal">
        <form id="planner-form">
            <h3 id="planner-modal-title">Adicionar Aula</h3>
            <input type="hidden" id="plan-id">
            <div class="form-grid">
                <!-- OPÇÕES ESPECIAIS E SWITCHER ÚLTIMA TURMA -->
                <div class="full-width" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 15px;">
                    <div style="display: flex; gap: 15px; align-items: center;">
                        <label style="flex-direction: row; gap: 5px; align-items: center;"><input type="checkbox" id="cb-especial"> Especial</label>
                        <label style="flex-direction: row; gap: 5px; align-items: center;"><input type="checkbox" id="cb-folga"> Folga</label>
                        <label style="flex-direction: row; gap: 5px; align-items: center;"><input type="checkbox" id="cb-prova"> Prova</label>
                    </div>
                </div>

                <label id="label-end-date" class="hidden full-width" style="color: var(--primary);">Data Final (Prova): 
                    <div style="display: flex; gap: 8px; align-items: center; margin-top: 5px;">
                        <input type="text" id="plan-end-date" placeholder="dd/mm/aaaa" maxlength="10" style="flex: 1;">
                        <input type="date" id="plan-end-date-picker" style="width: 38px; height: 38px; padding: 2px; cursor: pointer;" title="Escolher no calendário">
                        <button type="button" id="btn-replicar" class="btn-primary" style="padding: 8px 12px; font-size: 0.85rem; height: 38px;">Replicar</button>
                    </div>
                    <progress id="replicar-progress" value="0" max="100" class="hidden" style="width: 100%; margin-top: 5px;"></progress>
                </label>
                
                <label>Dia da Semana: 
                    <select id="plan-day" required>
                        <option value="">Selecione...</option>
                        <option value="Segunda-feira">Segunda-feira</option>
                        <option value="Terça-feira">Terça-feira</option>
                        <option value="Quarta-feira">Quarta-feira</option>
                        <option value="Quinta-feira">Quinta-feira</option>
                        <option value="Sexta-feira">Sexta-feira</option>
                        <option value="Sábado">Sábado</option>
                    </select>
                </label>

                <label>Data: 
                    <div style="display: flex; gap: 8px; align-items: center; margin-top: 5px;">
                        <input type="text" id="plan-date" placeholder="dd/mm/aaaa" required maxlength="10" style="flex: 1;">
                        <input type="date" id="plan-date-picker" style="width: 38px; height: 38px; padding: 2px; cursor: pointer;" title="Escolher no calendário">
                    </div>
                </label>

                <label>Hora: 
                    <select id="plan-time" required>
                        <option value="">Selecione...</option>
                        <option value="07:00">07:00</option>
                        <option value="07:50">07:50</option>
                        <option value="08:30">08:30</option>
                        <option value="09:10">09:10</option>
                        <option value="10:10">10:10</option>
                        <option value="10:50">10:50</option>
                        <option value="13:00">13:00</option>
                        <option value="13:50">13:50</option>
                        <option value="14:30">14:30</option>
                        <option value="15:10">15:10</option>
                        <option value="16:10">16:10</option>
                        <option value="16:50">16:50</option>
                        <option value="__ADD_NEW__">+ Adicionar novo</option>
                    </select>
                </label>

                <label>Série: 
                    <select id="plan-serie" required>
                        <option value="">Selecione...</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="__ADD_NEW__">+ Adicionar novo</option>
                    </select>
                </label>

                <label>Turma: 
                    <select id="plan-team" required>
                        <option value="">Selecione...</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="__ADD_NEW__">+ Adicionar novo</option>
                    </select>
                </label>

                <label>Duração: <input type="text" id="plan-duration"></label>
                <label class="full-width">Habilidades BNCC: <textarea id="plan-skills" rows="3"></textarea></label>
                <label class="full-width">Atividades: <textarea id="plan-activities" rows="4" required></textarea></label>
            </div>
            <div class="modal-actions">
                <button type="submit" class="btn-primary">Salvar</button>
                <button type="button" class="btn-secondary" onclick="document.getElementById('planner-modal').close()">Cancelar</button>
            </div>
        </form>
    </dialog>

    <!-- MODAL MISSIONS -->
    <dialog id="mission-modal">
        <form id="mission-form">
            <h3 id="mission-modal-title">Adicionar Missão</h3>
            <input type="hidden" id="mission-id">
            <div class="form-grid">
                <label class="full-width">Nome da Missão: <input type="text" id="mission-name" required></label>
                <label class="full-width">Link: <input type="text" id="mission-link"></label>
                <label>Score Recompensa: <input type="number" id="mission-score" required></label>
            </div>
            <div class="modal-actions">
                <button type="submit" class="btn-primary">Salvar</button>
                <button type="button" class="btn-secondary" onclick="document.getElementById('mission-modal').close()">Cancelar</button>
            </div>
        </form>
    </dialog>

    <!-- MODAL FLASHCARDS -->
    <dialog id="flashcard-modal">
        <form id="flashcard-form">
            <h3 id="flashcard-modal-title">Adicionar Flashcard</h3>
            <input type="hidden" id="flashcard-id">
            <div class="form-grid">
                <label class="full-width">Palavra (Word): <input type="text" id="fc-word" required></label>
                <label class="full-width">Tradução: <input type="text" id="fc-translation" required></label>
                <label class="full-width">Link de Áudio (audio_link): <input type="text" id="fc-audio"></label>
                <label class="full-width">Stack (Baralho): <input type="text" id="fc-stack" required></label>
            </div>
            <div class="modal-actions">
                <button type="submit" class="btn-primary">Salvar</button>
                <button type="button" class="btn-secondary" onclick="document.getElementById('flashcard-modal').close()">Cancelar</button>
            </div>
        </form>
    </dialog>

    <!-- Ponto de entrada do JS -->
    <script type="module" src="main.js"></script>
</body>
</html>
