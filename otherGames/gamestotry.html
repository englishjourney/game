<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games to try</title>
    
    <!-- Importando Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Importando fonte Inter do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        // Configuração customizada do Tailwind (cores, fontes, etc)
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            900: '#111827',
                            800: '#1f2937',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Estilos adicionais personalizados se necessário */
        body {
            background-color: #0f172a; /* Fundo escuro focado em games */
            color: #f8fafc;
        }
        
        /* Efeito de transição suave para os botões/cards */
        .game-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <!-- Container Principal -->
    <div class="max-w-6xl w-full bg-gray-900/50 backdrop-blur-md rounded-3xl p-6 md:p-10 shadow-2xl border border-gray-800">
        
        <!-- Cabeçalho -->
        <div class="mb-10 text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-500 mb-2">
                Games to try
            </h1>
            <p class="text-gray-400 text-sm md:text-base">
                Selecione um jogo da grade abaixo para começar sua aventura.
            </p>
        </div>

        <!-- Grade de Jogos onde o JS irá inserir os botões -->
        <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Os cards dos jogos serão injetados aqui pelo JavaScript -->
        </div>

    </div>

    <script>
        /* 
         * ======================================================================
         * 🎮 ÁREA DE CONFIGURAÇÃO DOS JOGOS 🎮
         * ======================================================================
         * Adicione, remova ou edite os itens abaixo para alterar os jogos na tela.
         */
        const gamesData = [
            {
                name: "Catching foods",
                imageUrl: "https://placehold.co/600x400/2c3e50/ffffff?text=Aventura+Epica",
                linkUrl: "https://englishjourney.github.io/game/otherGames/foods.html"
            },
            {
                name: "Colors",
                imageUrl: "https://placehold.co/600x400/e74c3c/ffffff?text=Corrida+Maluca",
                linkUrl: "https://englishjourney.github.io/game/otherGames/colors.html"
            },
            {
                name: "Memory - Animals",
                imageUrl: "https://placehold.co/600x400/8e44ad/ffffff?text=Batalha+Espacial",
                linkUrl: "https://englishjourney.github.io/game/otherGames/memory.html"
            },
            {
                name: "There is/There are",
                imageUrl: "https://placehold.co/600x400/27ae60/ffffff?text=Quebra-Cabecas",
                linkUrl: "https://englishjourney.github.io/game/otherGames/thereisthereare.html"
            },
            {
                name: "Cognates",
                imageUrl: "https://placehold.co/600x400/f39c12/ffffff?text=Luta+Ninja",
                linkUrl: "https://englishjourney.github.io/game/otherGames/cognates.html"
            },
            {
                name: "Symon Says - soon",
                imageUrl: "https://placehold.co/600x400/2980b9/ffffff?text=Futebol+Arcade",
                linkUrl: "erro404"
            }
            // Para adicionar mais, basta colocar uma vírgula no último e adicionar um novo bloco:
            // ,{ name: "Novo Jogo", imageUrl: "URL_DA_IMAGEM", linkUrl: "URL_DO_LINK" }
        ];
        /* ====================================================================== */

        
        // Função para renderizar os cards na tela
        function renderGames() {
            const gridContainer = document.getElementById('games-grid');
            
            // Limpa o container (útil se você chamar a função novamente no futuro)
            gridContainer.innerHTML = '';

            // Percorre a lista de jogos e cria o HTML para cada um
            gamesData.forEach(game => {
                // Criação do elemento de link (botão)
                const card = document.createElement('a');
                card.href = game.linkUrl;
                card.target = "_blank"; // Abre o link em uma nova aba
                card.rel = "noopener noreferrer"; // Boa prática de segurança para links externos
                
                // Aplicando as classes do Tailwind para estilizar o card
                card.className = "game-card block group relative rounded-2xl overflow-hidden shadow-lg border border-gray-700 hover:border-purple-500 hover:scale-[1.03] hover:shadow-purple-500/20 hover:z-10 bg-gray-800";

                // Estrutura interna do card (Imagem + Texto)
                card.innerHTML = `
                    <div class="aspect-video w-full overflow-hidden">
                        <!-- Imagem do jogo -->
                        <img src="${game.imageUrl}" alt="${game.name}" 
                             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                             onerror="this.src='https://placehold.co/600x400/1f2937/ffffff?text=Imagem+Indisponivel'"
                        />
                    </div>
                    
                    <!-- Gradiente escuro e Nome do jogo -->
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent opacity-90 group-hover:opacity-100 transition-opacity flex items-end">
                        <div class="p-4 w-full transform translate-y-2 group-hover:translate-y-0 transition-transform">
                            <h3 class="text-lg md:text-xl font-bold text-white tracking-wide truncate flex items-center justify-between">
                                ${game.name}
                                <svg class="w-5 h-5 text-purple-400 opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                                </svg>
                            </h3>
                        </div>
                    </div>
                `;

                // Adiciona o card gerado na grade
                gridContainer.appendChild(card);
            });
        }

        // Executa a função assim que a página termina de carregar
        document.addEventListener('DOMContentLoaded', renderGames);
    </script>
</body>
</html>
